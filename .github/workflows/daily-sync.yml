name: 每日上游同步与自动翻译

# 北京时间每天凌晨 03:00（UTC 19:00）运行：检测上游差异 → LLM 自动翻译 → 构建校验 → 提交部署 → 更新跟踪 issue
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检测差异并自动翻译
        id: sync
        run: node scripts/sync-check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

      - name: 构建校验
        run: npm ci && npm run build

      - name: 提交并推送（自动触发部署）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync/ docs-md/ site/
          if git diff --cached --quiet; then
            echo "无内容变更"
          else
            git commit -m "chore(sync): 上游差异自动翻译与快照更新"
            git push
          fi

      - name: 创建或更新跟踪 issue
        if: steps.sync.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f sync-report.md ]; then echo "无报告，跳过"; exit 0; fi
          NUM=$(gh issue list --state open --search "上游同步 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file sync-report.md
          else
            gh issue create --title "上游同步：待处理的官网差异" --body-file sync-report.md
          fi
